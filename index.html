<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TacoFloor — Restaurant Floor Manager</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* TacoFloor — chilango taquería theme */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#4A2318;
  --ink-soft:#6B4433;
  --cream:#FDF1DE;
  --tortilla:#F7DCB4;
  --masa:#E8A55A;
  --verde:#A9CF80;
  --verde-deep:#4F8F3A;
  --salsa:#C8384A;

  --bg:var(--verde);
  --bg2:var(--cream);
  --bg3:var(--tortilla);
  --border:rgba(74,35,24,.18);
  --border2:var(--ink);
  --text:var(--ink);
  --text2:var(--ink-soft);
  --text3:var(--ink-soft);
  --open-acc:var(--verde-deep);
  --await-acc:var(--salsa);
  --danger:var(--salsa);

  --font-head:'Alfa Slab One',Georgia,serif;
  --font-body:'Work Sans',system-ui,sans-serif;
  --font-mono:'Space Mono',ui-monospace,Menlo,monospace;
  --font-num:'Space Mono',ui-monospace,Menlo,monospace;
  --r:12px;
  --stroke:2px;
}

body{
  background:var(--verde);
  background-image:
    radial-gradient(circle at 14px 14px, rgba(74,35,24,.09) 3px, transparent 3.2px),
    radial-gradient(circle at 42px 42px, rgba(74,35,24,.09) 3px, transparent 3.2px);
  background-size:56px 56px;
  color:var(--ink);
  font-family:var(--font-body);
  min-height:100vh;
  overflow-x:hidden;
}
a{color:var(--ink)}
a:hover{color:var(--salsa)}

/* ── HEADER ── */
.header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;background:var(--ink);border-bottom:none}
.logo{display:flex;align-items:center;gap:16px;font-family:var(--font-head);font-size:27px;font-weight:400;letter-spacing:.4px;color:var(--cream);line-height:1}
.logo span{color:var(--masa)}
.logo-mark{width:60px;height:60px;flex:none;border-radius:50%;overflow:hidden;border:2.5px solid var(--cream);background:var(--verde)}
.logo-mark img{width:100%;height:100%;object-fit:cover;object-position:50% 24%;display:block}
.logo-sub{font:400 10px var(--font-mono);letter-spacing:.24em;text-transform:uppercase;color:rgba(253,241,222,.6);margin-top:7px}
.time{font-family:var(--font-mono);font-size:13px;color:rgba(253,241,222,.6)}
.header-right{display:flex;align-items:center;gap:9px}
.log-btn{background:transparent;border:1px solid rgba(253,241,222,.3);color:var(--cream);padding:8px 13px;border-radius:6px;cursor:pointer;font:500 12px var(--font-body)}
.log-btn:hover{background:rgba(253,241,222,.12)}
.role-badge{font:400 10px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;padding:5px 11px;border-radius:999px;border:1px solid rgba(253,241,222,.35);color:var(--cream)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--masa);border:2px solid var(--cream);display:flex;align-items:center;justify-content:center;font:700 12px var(--font-num);color:var(--ink);cursor:pointer;margin-left:5px}

/* ── STATS BAR ── */
.stats-bar{display:flex;gap:12px;padding:22px 28px 0;background:transparent;border-bottom:none}
.stat{flex:1;padding:14px 16px;background:var(--cream);border:var(--stroke) solid var(--ink);border-radius:10px;box-shadow:0 3px 0 var(--ink);text-align:left;cursor:pointer;transition:transform .15s}
.stat:hover{transform:translateY(-1px)}
.stat:last-child{border-right:var(--stroke) solid var(--ink)}
.stat-val{font-family:var(--font-num);font-weight:700;font-size:25px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat-val.green{color:var(--ink)}
.stat-val.amber{color:var(--salsa)}
.stat-val.mono{font-size:22px}
.stat-label{font:500 10.5px var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft);margin-top:7px}

/* ── TOOLBAR ── */
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:20px 28px 0;gap:12px;flex-wrap:wrap}
.filter-group{display:flex;gap:7px;flex-wrap:wrap}
.filter-btn{font:500 12px var(--font-body);padding:8px 16px;border-radius:999px;border:1.5px solid var(--ink);background:rgba(253,241,222,.55);color:var(--ink);cursor:pointer;transition:all .15s}
.filter-btn:hover{background:var(--cream)}
.filter-btn.active{background:var(--ink);border-color:var(--ink);color:var(--cream);font-weight:600}
.section-id{font:400 10px var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}

/* ── SECTION DIVIDER ── */
.section-divider{padding:20px 28px 0;display:flex;align-items:center;gap:12px}
.section-divider span{font-family:var(--font-head);font-size:15px;color:var(--ink);text-transform:none;letter-spacing:.02em}
.divider-line{flex:1;height:var(--stroke);background:var(--ink);border-radius:2px}

/* ── GRID ── */
.floor-grid{padding:16px 28px 8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}

/* ── TABLE CARD ── */
.table-card{border-radius:var(--r);border:var(--stroke) solid var(--ink);background:var(--cream);box-shadow:0 3px 0 var(--ink);cursor:pointer;transition:transform .15s;position:relative;overflow:hidden;user-select:none}
.table-card:hover{transform:translateY(-2px)}
.table-card.state-closed{background:var(--cream)}
.table-card.state-open{background:var(--cream)}
.table-card.state-awaiting{background:var(--ink)}
.card-accent{display:none}

.card-body{padding:0}
.card-top{display:flex;align-items:baseline;justify-content:space-between;padding:12px 14px 11px;margin:0;background:var(--tortilla);border-bottom:var(--stroke) solid var(--ink)}
.state-open .card-top{background:var(--masa)}
.state-awaiting .card-top{background:rgba(253,241,222,.12);border-bottom-color:rgba(253,241,222,.25)}
.table-num{font-family:var(--font-head);font-size:26px;font-weight:400;line-height:1;color:var(--ink)}
.state-awaiting .table-num{color:var(--cream)}
.status-dot-wrap{display:flex;align-items:baseline;gap:8px}
.status-chip{font:600 9.5px var(--font-mono);padding:0;background:none !important;letter-spacing:.14em;text-transform:uppercase}
.chip-closed{color:var(--ink-soft)}
.chip-open{color:var(--ink)}
.chip-await{color:#F0A9A0}
.loc-badge{font:400 9px var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.state-open .loc-badge{color:var(--ink)}
.state-awaiting .loc-badge{color:#E8C9A8}

.card-info{display:flex;flex-direction:column;gap:5px;margin:0;padding:12px 14px 0}
.info-row{display:flex;justify-content:space-between;font:400 12px var(--font-body);color:var(--ink-soft)}
.state-awaiting .info-row{color:#E4CFBC}
.info-row .val{color:var(--ink);font-weight:600}
.state-awaiting .info-row .val{color:var(--cream)}
.info-row .val.accent-green,.info-row .val.accent-amber{color:var(--ink);font-family:var(--font-num)}
.state-awaiting .info-row .val.accent-amber{color:var(--cream)}

.card-actions{display:flex;gap:7px;padding:12px 14px 14px}
.act-btn{flex:1;padding:9px 0;font:600 11.5px var(--font-body);border-radius:7px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;text-align:center;transition:all .15s}
.act-btn:hover{background:rgba(74,35,24,.08)}
.act-btn.primary{background:var(--verde-deep);border-color:transparent;color:var(--cream)}
.act-btn.primary:hover{background:#427C30}
.act-btn.amber{background:var(--salsa);border-color:transparent;color:var(--cream)}
.act-btn.amber:hover{background:#B22F40}
.state-awaiting .act-btn{border-color:rgba(253,241,222,.5);color:var(--cream)}
.state-awaiting .act-btn:hover{background:rgba(253,241,222,.12)}
.state-awaiting .act-btn.amber{background:var(--salsa);border-color:transparent}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(74,35,24,.55);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--cream);border:var(--stroke) solid var(--ink);border-bottom:none;border-radius:16px 16px 0 0;width:100%;max-width:520px;padding:24px;transform:translateY(30px);transition:transform .25s cubic-bezier(.34,1.56,.64,1);max-height:90vh;overflow-y:auto}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-handle{width:44px;height:4px;background:var(--ink);opacity:.35;border-radius:999px;margin:0 auto 20px;cursor:pointer}
.modal-title{font-family:var(--font-head);font-size:20px;font-weight:400;color:var(--ink);margin-bottom:6px;line-height:1.15}
.modal-sub{font:400 13px var(--font-body);color:var(--ink-soft);margin-bottom:20px}
.modal-sub strong{color:var(--salsa);font-family:var(--font-num)}
.modal-section{margin-bottom:18px}
.modal-label{font:400 10px var(--font-mono);text-transform:uppercase;letter-spacing:.16em;color:var(--ink-soft);margin-bottom:9px}
.modal-field{background:var(--tortilla);border:var(--stroke) solid var(--ink);border-radius:8px;padding:11px 14px;font:400 14px var(--font-body);color:var(--ink);width:100%;outline:none}
.modal-field:focus{box-shadow:0 0 0 3px rgba(74,35,24,.15)}
select.modal-field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}

.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.menu-item{background:var(--cream);border:1.5px solid var(--ink);border-radius:9px;padding:11px 12px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:4px}
.menu-item:hover{background:var(--tortilla)}
.menu-item.selected{background:rgba(79,143,58,.14);border-color:var(--verde-deep);border-width:2px}
.menu-item-name{font:600 13px var(--font-body);color:var(--ink)}
.menu-item-price{font:700 12px var(--font-num);color:var(--salsa)}
.menu-item-qty{display:flex;align-items:center;gap:9px;margin-top:6px}
.qty-btn{width:24px;height:24px;border-radius:5px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.qty-btn:hover{background:var(--tortilla)}
.qty-val{font:700 13px var(--font-num);min-width:22px;text-align:center;color:var(--ink)}

.order-summary{background:var(--tortilla);border:var(--stroke) solid var(--ink);border-radius:9px;padding:12px 15px}
.order-row{display:flex;justify-content:space-between;font:400 13px var(--font-body);padding:4px 0;border-bottom:1px solid rgba(74,35,24,.15);color:var(--ink-soft)}
.order-row:last-child{border-bottom:none;font-weight:700;font-size:14px;padding-top:9px;margin-top:2px;color:var(--ink)}
.order-row .price{font-family:var(--font-num);color:var(--ink);font-variant-numeric:tabular-nums}
.order-row:last-child .price{color:var(--salsa)}

.modal-actions{display:flex;gap:9px;margin-top:20px}
.modal-btn{flex:1;padding:12px;border-radius:8px;border:var(--stroke) solid var(--ink);background:transparent;color:var(--ink);font:600 13px var(--font-body);cursor:pointer;transition:all .15s}
.modal-btn:hover{background:rgba(74,35,24,.08)}
.modal-btn.confirm{background:var(--verde-deep);color:var(--cream);box-shadow:0 3px 0 var(--ink);flex:1.5}
.modal-btn.confirm:hover{background:#427C30}
.modal-btn.amber-btn{background:var(--salsa);color:var(--cream);box-shadow:0 3px 0 var(--ink);flex:1.5}
.modal-btn.amber-btn:hover{background:#B22F40}

.pay-methods{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pay-card{background:var(--tortilla);border:var(--stroke) solid var(--ink);border-radius:9px;padding:13px;cursor:pointer;text-align:center;transition:all .15s}
.pay-card:hover{background:var(--cream)}
.pay-card.selected{background:var(--verde-deep)}
.pay-card.selected .pay-name{color:var(--cream)}
.pay-card .pay-name{font-family:var(--font-head);font-size:15px;font-weight:400;color:var(--ink)}
.net-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.net-grid .pay-card{padding:10px 4px}
.net-grid .pay-name{font:600 11px var(--font-body)}

.split-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.split-toggle-label{display:flex;align-items:center;gap:11px;font:500 13px var(--font-body);color:var(--ink);cursor:pointer}
.toggle{width:40px;height:23px;border-radius:999px;background:var(--tortilla);border:1.5px solid var(--ink);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--verde-deep)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--cream);transition:transform .2s}
.toggle.on::after{transform:translateX(17px)}
.remaining{text-align:center;padding:11px;background:transparent;border:var(--stroke) solid var(--salsa);border-radius:8px;font:700 15px var(--font-num);color:var(--salsa)}

/* ── PULSE ── */
@keyframes pulse-amber{0%,100%{opacity:1}50%{opacity:.55}}
.pulse{animation:pulse-amber 2s ease-in-out infinite}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);border:var(--stroke) solid var(--ink);border-radius:999px;padding:10px 22px;font:500 13px var(--font-body);color:var(--cream);opacity:0;transition:all .3s;pointer-events:none;z-index:200;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── LEFT SIDEBAR ── */
.left-sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--cream);border-right:var(--stroke) solid var(--ink);padding:18px 12px;display:flex;flex-direction:column;gap:10px;z-index:140}
.left-sidebar .log-btn{justify-content:flex-start}
.left-sidebar.hidden{transform:translateX(-100%);transition:transform .2s}
.main-content{transition:margin-left .2s;padding-left:12px}
.sidebar-tab{position:fixed;left:0;top:50%;transform:translate(-100%, -50%);background:var(--tortilla);border:var(--stroke) solid var(--ink);border-radius:0 6px 6px 0;padding:8px;cursor:pointer;z-index:160}

/* ── EMPTY STATE ── */
.empty-state{grid-column:1/-1;padding:30px 24px;text-align:center;font:400 13px var(--font-body);color:var(--ink-soft);background:rgba(253,241,222,.6);border:2px dashed var(--ink);border-radius:var(--r)}

.num,.stat-val,.table-num,.menu-item-price,.qty-val,.order-row .price{font-variant-numeric:tabular-nums}
.table-num{font-family:var(--font-head)}

@media(max-width:640px){
  .header{flex-wrap:wrap;gap:12px;padding:14px 16px}
  .logo{font-size:22px;gap:12px}
  .logo-mark{width:46px;height:46px}
  .stats-bar{flex-wrap:wrap;padding:16px 16px 0}
  .stat{min-width:calc(50% - 6px)}
  .toolbar,.section-divider{padding-left:16px;padding-right:16px}
  .floor-grid{padding:14px 16px 8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
</style>
</head>

let isSplit = false;
let closedLogs = []; // {tableId, tableNumber, waiter, items:[{name,qty,price}], total, ts}
let menuLogs = []; // [{dishId,name,qty,price,tableNumber,waiter,ts}]
let waiterSessions = []; // [{waiter, loginTs, servedTables:[{tableNumber,total,ts}], revenue}]
let currentWaiter = null; // name of currently-logged-in waiter when role is WAITER

// ─── HELPERS ──────────────────────────────────────
function getTotal(t){
  return t.items.reduce((s,it)=>{
    const d = MENU.find(m=>m.id===it.dishId);
    return s + (d ? d.price * it.qty : 0);
  }, 0);
}
function fmt(n){ return '$' + n.toFixed(2); }
function padNum(n){ return n < 10 ? '0'+n : ''+n; }
function stateClass(s){ return s==='CLOSED'?'state-closed':s==='OPEN'?'state-open':'state-awaiting'; }
function stateChip(s){
  if(s==='CLOSED') return '<span class="status-chip chip-closed">Closed</span>';
  if(s==='OPEN')   return '<span class="status-chip chip-open">Open</span>';
  return '<span class="status-chip chip-await pulse">Awaiting</span>';
}

// ─── STATS ────────────────────────────────────────
function updateStats(){
  document.getElementById('stat-open').textContent    = tables.filter(t=>t.status==='OPEN').length;
  document.getElementById('stat-await').textContent   = tables.filter(t=>t.status==='AWAITING_PAYMENT').length;
  document.getElementById('stat-covers').textContent  = tables.filter(t=>t.status!=='CLOSED').reduce((s,t)=>s+t.guestCount,0);
  document.getElementById('stat-revenue').textContent = fmt(revenue);
}

// ─── RENDER ───────────────────────────────────────
function renderCard(t){
  const total = getTotal(t);
  let actions = '';
  if(t.status==='CLOSED'){
    actions = `<button class="act-btn primary" onclick="openOpenModal('${t.id}')">Open table</button>`;
  } else if(t.status==='OPEN'){
    actions = `<button class="act-btn" onclick="openOrderModal('${t.id}')">Order</button>
               <button class="act-btn amber" onclick="doCloseTable('${t.id}')">Close check</button>`;
  } else {
    actions = `<button class="act-btn amber" onclick="openPayModal('${t.id}')">Pay ${fmt(total)}</button>`;
    if(currentRole==='MANAGER') actions += `<button class="act-btn" onclick="approveTable('${t.id}')">Approve</button>`;
  }
  let infoRows = '';
  if(t.status!=='CLOSED'){
    infoRows += `<div class="info-row"><span>Guests</span><span class="val num">${t.guestCount}</span></div>`;
    if(total>0) infoRows += `<div class="info-row"><span>Total</span><span class="val accent-amber num">${fmt(total)}</span></div>`;
  }
  infoRows += `<div class="info-row"><span>Waiter</span><span class="val">${t.waiter}</span></div>`;
  infoRows += `<div class="info-row"><span>Seats</span><span class="val num">${t.capacity}</span></div>`;

  return `<div class="table-card ${stateClass(t.status)}" id="card-${t.id}">
    <div class="card-accent"></div>
    <div class="card-body">
      <div class="card-top">
        <div class="table-num">${padNum(t.number)}</div>
        <div class="status-dot-wrap">${stateChip(t.status)}<span class="loc-badge">${t.location}</span></div>
      </div>
      <div class="card-info">${infoRows}</div>
      <div class="card-actions">${actions}</div>
    </div>
  </div>`;
}

function renderGrid(){
  function matchesFilter(t){
    if(activeFilter==='all') return true;
    if(activeFilter==='HAS_COVERS') return t.status!=='CLOSED' && t.guestCount>0;
    return t.status===activeFilter;
  }
  const indoor  = tables.filter(t=>t.location==='INDOOR'  && matchesFilter(t));
  const outdoor = tables.filter(t=>t.location==='OUTDOOR' && matchesFilter(t));
  document.getElementById('indoor-grid').innerHTML  = indoor.length  ? indoor.map(renderCard).join('')  : '<div class="empty-state">No tables match this filter</div>';
  document.getElementById('outdoor-grid').innerHTML = outdoor.length ? outdoor.map(renderCard).join('') : '<div class="empty-state">No tables match this filter</div>';
  updateStats();
}

// ─── MODAL ────────────────────────────────────────
function openModal(html){
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  tempOrders = {};
  payMethod = 'CASH';
  isSplit = false;
}
document.getElementById('modal-overlay').addEventListener('click', e=>{
  if(e.target === document.getElementById('modal-overlay')) closeModal();
});
document.getElementById('modal-handle').addEventListener('click', closeModal);

// ─── OPEN TABLE ───────────────────────────────────
function openOpenModal(id){
  const t = tables.find(x=>x.id===id);
  const waiterOptions = WAITERS.map(w=>`<option value="${w}"${w===t.waiter?' selected':''}>${w}</option>`).join('');
  const waiterSection = currentRole==='MANAGER' ? `
    <div class="modal-section">
      <div class="modal-label">Assign waiter</div>
      <select class="modal-field" id="waiter-select">${waiterOptions}</select>
    </div>` : '';
  openModal(`
    <div class="modal-title">Open table ${padNum(t.number)}</div>
    <div class="modal-sub">${t.capacity} seats · ${t.location.toLowerCase()}</div>
    <div class="modal-section">
      <div class="modal-label">Guest count</div>
      <input class="modal-field" type="number" id="guest-input" min="1" max="${t.capacity}" value="2"
        style="font-family:var(--font-mono);font-size:20px;text-align:center">
    </div>
    ${waiterSection}
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeModal()">Cancel</button>
      <button class="modal-btn confirm" onclick="doOpenTable('${id}')">Open table</button>
    </div>
  `);
}
function doOpenTable(id){
  const t = tables.find(x=>x.id===id);
  t.guestCount = parseInt(document.getElementById('guest-input').value) || 2;
  t.status = 'OPEN';
  t.items = [];
  const ws = document.getElementById('waiter-select');
  if(ws) t.waiter = ws.value;
  closeModal();
  renderGrid();
  showToast(`Table ${t.number} opened · ${t.guestCount} guests`);
}

// ─── ORDER ────────────────────────────────────────
function openOrderModal(id){
  const t = tables.find(x=>x.id===id);
  tempOrders = {};
  t.items.forEach(it => tempOrders[it.dishId] = it.qty);
  renderOrderModal(id);
}
function renderOrderModal(id){
  const t = tables.find(x=>x.id===id);
  const menuHtml = MENU.map(d=>{
    const qty = tempOrders[d.id] || 0;
    return `<div class="menu-item${qty>0?' selected':''}">
      <div class="menu-item-name">${d.name}</div>
      <div class="menu-item-price">${fmt(d.price)}</div>
      <div class="menu-item-qty">
        <button class="qty-btn" onclick="adjQty('${id}','${d.id}',-1)">−</button>
        <span class="qty-val">${qty}</span>
        <button class="qty-btn" onclick="adjQty('${id}','${d.id}',1)">+</button>
      </div>
    </div>`;
  }).join('');
  const total = Object.entries(tempOrders).reduce((s,[did,q])=>{
    const d = MENU.find(m=>m.id===did); return s+(d?d.price*q:0);},0);
  const items = Object.entries(tempOrders).filter(([,q])=>q>0);
  const summaryHtml = items.length
    ? items.map(([did,q])=>{ const d=MENU.find(m=>m.id===did);
        return `<div class="order-row"><span><span class="num">${q}</span>× ${d.name}</span><span class="price">${fmt(d.price*q)}</span></div>`;
      }).join('') + `<div class="order-row"><span>Total</span><span class="price">${fmt(total)}</span></div>`
    : '<div style="font-size:13px;color:var(--text3);text-align:center;padding:8px">No items yet</div>';
  openModal(`
    <div class="modal-title">Table ${padNum(t.number)} — Order</div>
    <div class="modal-sub">${t.guestCount} guests · Waiter: ${t.waiter}</div>
    <div class="modal-section">
      <div class="modal-label">Menu</div>
      <div class="menu-grid">${menuHtml}</div>
    </div>
    <div class="modal-section">
      <div class="modal-label">Summary</div>
      <div class="order-summary">${summaryHtml}</div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeModal()">Cancel</button>
      <button class="modal-btn confirm" onclick="saveOrder('${id}')">Save order</button>
    </div>
  `);
}
function adjQty(tid,did,delta){
  tempOrders[did] = Math.max(0, (tempOrders[did]||0) + delta);
  renderOrderModal(tid);
}
function saveOrder(id){
  const t = tables.find(x=>x.id===id);
  t.items = Object.entries(tempOrders).filter(([,q])=>q>0).map(([dishId,qty])=>({dishId,qty}));
  // log ordered items for menu log
  addMenuLogEntries(t);
  closeModal();
  renderGrid();
  showToast('Order updated');
}

// ─── CLOSE TABLE ──────────────────────────────────
function doCloseTable(id){
  const t = tables.find(x=>x.id===id);
  if(!t.items.length){ showToast('⚠ Add items before closing'); return; }
  t.status = 'AWAITING_PAYMENT';
  renderGrid();
  showToast(`Table ${t.number} closed — awaiting payment`);
}

// ─── PAYMENT ──────────────────────────────────────
function openPayModal(id){
  const t = tables.find(x=>x.id===id);
  const total = getTotal(t);
  payMethod = 'CASH'; isSplit = false;
  openModal(`
    <div class="modal-title">Payment — Table ${padNum(t.number)}</div>
    <div class="modal-sub">Total: <strong class="num" style="color:var(--await-acc)">${fmt(total)}</strong> · <span class="num">${t.guestCount}</span> guests</div>
    <div class="modal-section">
      <div class="modal-label">Order</div>
      <div class="order-summary">
        ${t.items.map(it=>{ const d=MENU.find(m=>m.id===it.dishId);
          return `<div class="order-row"><span><span class="num">${it.qty}</span>× ${d.name}</span><span class="price">${fmt(d.price*it.qty)}</span></div>`;
        }).join('')}
        <div class="order-row"><span>Total</span><span class="price">${fmt(total)}</span></div>
      </div>
    </div>
    <div class="modal-section">
      <div class="modal-label">Payment method</div>
      <div class="pay-methods">
        <div class="pay-card selected" id="pay-cash" onclick="selectPayMethod('CASH')">
          <div class="pay-name">Cash</div>
        </div>
        <div class="pay-card" id="pay-card-opt" onclick="selectPayMethod('CARD')">
          <div class="pay-name">Card</div>
        </div>
      </div>
    </div>
    <div class="modal-section" id="card-networks" style="display:none">
      <div class="modal-label">Card network</div>
      <div class="net-grid">
        <div class="pay-card selected" id="net-visa"  onclick="selectNet('visa')"><div class="pay-name">VISA</div></div>
        <div class="pay-card"          id="net-mc"    onclick="selectNet('mc')"><div class="pay-name">Mastercard</div></div>
        <div class="pay-card"          id="net-amex"  onclick="selectNet('amex')"><div class="pay-name">Amex</div></div>
        <div class="pay-card"          id="net-other" onclick="selectNet('other')"><div class="pay-name">Other</div></div>
      </div>
    </div>
    <div class="modal-section">
      <div class="split-row">
        <label class="split-toggle-label">
          <button class="toggle" id="split-toggle" onclick="toggleSplit(${total})"></button>
          Split bill
        </label>
      </div>
      <div id="split-section" style="display:none;margin-top:12px">
        <div class="modal-label">Amount to pay now</div>
        <input class="modal-field" type="number" id="split-amount" min="0.01" max="${total.toFixed(2)}" step="0.01"
          value="${(total/2).toFixed(2)}" style="font-family:var(--font-num);font-size:18px;text-align:center"
          oninput="updateRemaining(${total})">
        <div class="remaining" style="margin-top:8px" id="remaining-display">Remaining: <span class="num">${fmt(total/2)}</span></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeModal()">Cancel</button>
      <button class="modal-btn amber-btn" onclick="processPayment('${id}',${total})">Register payment</button>
    </div>
  `);
}
function selectPayMethod(m){
  payMethod = m;
  document.getElementById('pay-cash').classList.toggle('selected', m==='CASH');
  document.getElementById('pay-card-opt').classList.toggle('selected', m==='CARD');
  document.getElementById('card-networks').style.display = m==='CARD' ? 'block' : 'none';
}
function selectNet(n){
  ['visa','mc','amex','other'].forEach(k=>{
    const el = document.getElementById('net-'+k);
    if(el) el.classList.toggle('selected', k===n);
  });
}
function addClosedLog(t, total){
  const items = (t.items||[]).map(it=>{
    const d = MENU.find(m=>m.id===it.dishId) || {name:'Unknown',price:0};
    return {name:d.name, qty:it.qty, price:d.price};
  });
  closedLogs.push({
    tableId: t.id,
    tableNumber: t.number,
    waiter: t.waiter,
    items: items,
    total: total,
    ts: new Date().toISOString()
  });
  // also attribute this closed table to the waiter's current session (if any)
  const ts = new Date().toISOString();
  let sess = waiterSessions.slice().reverse().find(s => s.waiter === t.waiter);
  if(!sess){
    // create a session placeholder if waiter wasn't logged in
    sess = { waiter: t.waiter, loginTs: ts, servedTables: [], revenue: 0 };
    waiterSessions.push(sess);
  }
  sess.servedTables.push({ tableNumber: t.number, total: total, ts: ts });
  sess.revenue = (sess.revenue || 0) + total;
}

function formatTS(iso){
  const d = new Date(iso);
  return d.toLocaleString();
}

function openClosedLogModal(){
  if(!closedLogs.length) return openModal('<div class="modal-title">Closed tables</div><div class="modal-sub">No closed tables yet</div>');
  const rows = closedLogs.slice().reverse().map(c=>{
    const itemsHtml = c.items.map(it=>`<div style="display:flex;justify-content:space-between;padding:3px 0"><span>${it.qty}× ${it.name}</span><span class=\"price\">${fmt(it.price*it.qty)}</span></div>`).join('');
    return `
      <div style="border-bottom:1px solid var(--border);padding:10px 0">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div style="font-weight:700">Table ${padNum(c.tableNumber)} · ${c.waiter}</div>
          <div style="font-family:var(--font-num);">${formatTS(c.ts)}</div>
        </div>
        <div class="order-summary">${itemsHtml}<div style="display:flex;justify-content:space-between;padding-top:6px;font-weight:600"><span>Closed check</span><span class=\"price\">${fmt(c.total)}</span></div></div>
      </div>`;
  }).join('');
  openModal(`
    <div class="modal-title">Closed tables</div>
    <div class="modal-sub">Recent closed tables (newest first)</div>
    <div class="modal-section">${rows}</div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeModal()">Close</button>
      <button class="modal-btn" onclick="clearClosedLogs()">Clear log</button>
    </div>
  `);
}

function clearClosedLogs(){
  closedLogs = [];
  closeModal();
  showToast('Closed tables log cleared');
}

function addMenuLogEntries(t){
  const ts = new Date().toISOString();
  (t.items||[]).forEach(it=>{
    const d = MENU.find(m=>m.id===it.dishId) || {name:'Unknown',price:0};
    menuLogs.push({
      dishId: it.dishId,
      name: d.name,
      qty: it.qty,
      price: d.price,
      tableNumber: t.number,
      waiter: t.waiter,
      ts: ts
    });
  });
}

function openMenuLogModal(){
  if(!menuLogs.length) return openModal('<div class="modal-title">Menu log</div><div class="modal-sub">No menu orders yet</div>');
  const rows = menuLogs.slice().reverse().map(m=>{
    return `<div style="border-bottom:1px solid var(--border);padding:8px 0;display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:13px">${m.qty}× ${m.name} <span style="color:var(--text2);font-size:12px">· Table ${padNum(m.tableNumber)} · ${m.waiter}</span></div>
      <div style="text-align:right"><div class=\"price\">${fmt(m.price*m.qty)}</div><div style=\"font-family:var(--font-num);font-size:12px;color:var(--text2)\">${formatTS(m.ts)}</div></div>
    </div>`;
  }).join('');
  openModal(`
    <div class="modal-title">Menu log</div>
    <div class="modal-sub">All ordered items (newest first)</div>
    <div class="modal-section">${rows}</div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeModal()">Close</button>
      <button class="modal-btn" onclick="clearMenuLog()">Clear log</button>
    </div>
  `);
}

function clearMenuLog(){
  menuLogs = [];
  closeModal();
  showToast('Menu log cleared');
}

// sidebar state & toggle
let sidebarOpen = true;
function toggleSidebar(){
  sidebarOpen = !sidebarOpen;
  const el = document.getElementById('left-sidebar');
  const main = document.getElementById('main-content');
  if(!el || !main) return;
  el.classList.toggle('hidden', !sidebarOpen);
  main.style.marginLeft = sidebarOpen ? '240px' : '12px';
}


function openWaiterLoginModal(){
  const options = WAITERS.map(w=>`<option value="${w}">${w}</option>`).join('');
  openModal(`
    <div class="modal-title">Waiter login</div>
    <div class="modal-sub">Select your name to sign in as waiter</div>
    <div class="modal-section">
      <div class="modal-label">Waiter</div>
      <select class="modal-field" id="waiter-login-select">${options}</select>
    </div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeModal()">Cancel</button>
      <button class="modal-btn confirm" onclick="doWaiterLogin()">Sign in</button>
    </div>
  `);
}

function doWaiterLogin(){
  const sel = document.getElementById('waiter-login-select');
  if(!sel) return;
  const name = sel.value;
  currentRole = 'WAITER';
  currentWaiter = name;
  // create a new session for this login
  waiterSessions.push({ waiter: name, loginTs: new Date().toISOString(), servedTables: [], revenue: 0 });
  document.getElementById('user-avatar').textContent = name.split(' ').map(s=>s[0]).slice(0,2).join('').toUpperCase();
  document.getElementById('role-badge').textContent = 'Waiter';
  closeModal();
  renderGrid();
  showToast(`Signed in as ${name}`);
}

function openWaiterLogModal(){
  if(!waiterSessions.length) return openModal('<div class="modal-title">Waiter log</div><div class="modal-sub">No waiter sessions yet</div>');
  const rows = waiterSessions.slice().reverse().map(s=>{
    const servedHtml = s.servedTables.length ? s.servedTables.map(st=>`<div style="display:flex;justify-content:space-between;padding:3px 0"><span>Table ${padNum(st.tableNumber)}</span><span class=\"price\">${fmt(st.total)}</span></div>`).join('') : '<div style="color:var(--text2);font-size:13px;padding:6px 0">No tables served yet</div>';
    return `
      <div style="border-bottom:1px solid var(--border);padding:10px 0">
        <div style="display:flex;jucontent:space-between;align-items:center;margin-bottom:6px">
          <div style="font-weight:700">${s.waiter}</div>
          <div style="font-family:var(--font-num);">Logged in: ${formatTS(s.loginTs)}</div>
        </div>
        <div style="margin-bottom:8px;font-size:13px;color:var(--text2)">Revenue: <strong>${fmt(s.revenue||0)}</strong></div>
        <div class="order-summary">${servedHtml}</div>
      </div>`;
  }).join('');
  openModal(`
    <div class="modal-title">Waiter log</div>
    <div class="modal-sub">Sessions and served tables (newest first)</div>
    <div class="modal-section">${rows}</div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeModal()">Close</button>
      <button class="modal-btn" onclick="clearWaiterLogs()">Clear log</button>
    </div>
  `);
}

function clearWaiterLogs(){
  waiterSessions = [];
  closeModal();
  showToast('Waiter log cleared');
}
function setFilterFromStat(filter){
  activeFilter = filter;
  // update toolbar buttons active state (if matching button exists)
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  const btn = document.querySelector(`.filter-btn[data-filter="${filter}"]`);
  if(btn) btn.classList.add('active');
  renderGrid();
  // scroll to floor area
  const el = document.getElementById('indoor-grid');
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}
function initStatInteractions(){
  const sOpen = document.getElementById('stat-open');
  const sAwait = document.getElementById('stat-await');
  const sCovers = document.getElementById('stat-covers');
  const sRev = document.getElementById('stat-revenue');
  if(sOpen) sOpen.addEventListener('click', ()=>setFilterFromStat('OPEN'));
  if(sAwait) sAwait.addEventListener('click', ()=>setFilterFromStat('AWAITING_PAYMENT'));
  if(sCovers) sCovers.addEventListener('click', ()=>setFilterFromStat('HAS_COVERS'));
  if(sRev) sRev.addEventListener('click', ()=>setFilterFromStat('CLOSED'));
  const logBtn = document.getElementById('closed-log-btn');
  if(logBtn) logBtn.addEventListener('click', ()=>{
    if(currentRole!=='MANAGER'){ showToast('Manager only'); return; }
    openClosedLogModal();
  });
  const menuBtn = document.getElementById('menu-log-btn');
  if(menuBtn) menuBtn.addEventListener('click', ()=>{
    openMenuLogModal();
  });
  const waiterBtn = document.getElementById('waiter-log-btn');
  if(waiterBtn) waiterBtn.addEventListener('click', ()=>{
    if(currentRole!=='MANAGER'){ showToast('Manager only'); return; }
    openWaiterLogModal();
  });
}
function toggleSplit(total){
  isSplit = !isSplit;
  document.getElementById('split-toggle').classList.toggle('on', isSplit);
  document.getElementById('split-section').style.display = isSplit ? 'block' : 'none';
}
function updateRemaining(total){
  const v = parseFloat(document.getElementById('split-amount').value) || 0;
  document.getElementById('remaining-display').innerHTML = 'Remaining: <span class="num">' + fmt(total - v) + '</span>';
}
function processPayment(id, total){
  const t = tables.find(x=>x.id===id);
  let amount = total;
  if(isSplit){
    amount = parseFloat(document.getElementById('split-amount').value) || total;
    if(amount < total){
      showToast(`Partial payment of ${fmt(amount)} registered`);
      closeModal();
      return;
    }
  }
  // log closed table before clearing
  addClosedLog(t, total);
  revenue += total;
  t.status = 'CLOSED';
  t.items = [];
  t.guestCount = 0;
  closeModal();
  renderGrid();
  showToast(`✓ Payment of ${fmt(total)} registered`);
}

// ─── APPROVE ──────────────────────────────────────
function approveTable(id){
  const t = tables.find(x=>x.id===id);
  const total = getTotal(t);
  addClosedLog(t, total);
  revenue += total;
  t.status = 'CLOSED';
  t.items = [];
  t.guestCount = 0;
  renderGrid();
  showToast(`✓ Table ${t.number} approved & closed`);
}

// ─── FILTER ───────────────────────────────────────
document.getElementById('filter-group').addEventListener('click', e=>{
  if(!e.target.matches('.filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  activeFilter = e.target.dataset.filter;
  renderGrid();
});

// ─── ROLE TOGGLE ──────────────────────────────────
document.getElementById('user-avatar').addEventListener('click', ()=>{
  if(currentRole === 'MANAGER'){
    openWaiterLoginModal();
  } else {
    currentRole = 'MANAGER';
    currentWaiter = null;
    document.getElementById('user-avatar').textContent = 'MG';
    document.getElementById('role-badge').textContent = 'Manager';
    renderGrid();
    showToast('Switched to manager view');
  }
});

// Clock removed — redundant in this UI

// ─── TOAST ────────────────────────────────────────
let toastTimer;
function showToast(msg){
  clearTimeout(toastTimer);
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2500);
}

// ─── INIT ─────────────────────────────────────────
// ensure sidebar layout on load
const _ls = document.getElementById('left-sidebar');
const _mc = document.getElementById('main-content');
if(_ls && _mc){ _ls.classList.toggle('hidden', !sidebarOpen); _mc.style.marginLeft = sidebarOpen ? '240px' : '12px'; }
initStatInteractions();
renderGrid();
</script>
</body>
</html>
